include:
  # Left-master setup: flash totem_left to the left half and totem_right to the right half.
  - board: seeeduino_xiao_ble
    shield: totem_left
  - board: seeeduino_xiao_ble
    shield: totem_right

  # Dongle-master setup: flash totem_dongle to the dongle, totem_left_peripheral
  # to the left half, and totem_right to the right half.
  - board: seeeduino_xiao_ble
    shield: totem_dongle prospector_adapter
  - board: seeeduino_xiao_ble
    shield: totem_left_peripheral
  - board: seeeduino_xiao_ble
    shield: settings_reset
